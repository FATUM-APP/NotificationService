spring:
  application:
    name: NotificationService
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

server:
  port: ${PORT:8080}

aws:
  region: ${AWS_REGION:us-east-1}

fatum:
  notifications:
    # Cola SQS suscrita al bus de EventBridge (reglas de EventBridge -> SQS).
    queue-name: ${NOTIFICATION_QUEUE_NAME:fatum-notification-queue}
    # Cuánto tiempo vive una notificación en la bandeja (días). Se usa como TTL de DynamoDB.
    retention-days: ${NOTIFICATION_RETENTION_DAYS:60}
    # Tamaño máximo de página que puede pedir el cliente.
    max-page-size: ${NOTIFICATION_MAX_PAGE_SIZE:50}
  # Canal en tiempo real (SSE) hacia la GUI.
  sse:
    timeout-ms: 1800000
    # Debe ser menor que el idle timeout del ALB (60 s por defecto).
    heartbeat-ms: 20000
    max-connections-per-user: 5
  dynamodb:
    table-name: ${NOTIFICATION_TABLE_NAME:fatum-notifications}
    # Solo para desarrollo con DynamoDB Local o para el primer despliegue.
    endpoint-override: ${DYNAMODB_ENDPOINT:}
    create-table: ${DYNAMODB_CREATE_TABLE:false}

app:
  security:
    enabled: ${SECURITY_ENABLED:true}
    issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
